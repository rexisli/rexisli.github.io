# Fluid 主题覆盖配置
# 这里只写与主题默认不同的项，其余全部沿用 hexo-theme-fluid 的默认值。

navbar:
  blog_title: 'Rexisli'

index:
  slogan:
    - 记录一些值得记下的东西

post:
  math:
    # 公式已由 markdown-it-katex 在构建时静态渲染，这里关闭客户端 MathJax 以免重复处理
    enable: false
    engine: katex

# 本地 KaTeX 样式（含 woff2 字体，不走 CDN）
custom_css:
  - /css/katex.min.css

footer:
  content: |
    <a href="https://hexo.io" target="_blank" rel="nofollow noopener">Hexo</a> + <a href="https://github.com/fluid-dev/hexo-theme-fluid" target="_blank" rel="nofollow noopener">Fluid</a>
