# Hexo Configuration
# 站点名 / 描述
title: Rexisli
subtitle: ''
description: '记录一些值得记下的东西'
keywords: ''
author: rexisli
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## 这是用户主页仓库，地址固定为 https://rexisli.github.io
url: https://rexisli.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Extensions
theme: fluid

# Include / Exclude file(s)
include:
exclude:
ignore:

# Markdown 渲染：用 markdown-it + KaTeX，公式在构建时静态渲染（不依赖 CDN）
markdown:
  preset: 'default'
  render:
    html: true
    xhtmlOut: false
    breaks: true
    linkify: true
    typographer: false
  plugins:
    - name: '@neilsustc/markdown-it-katex'
      options:
        throwOnError: false
        errorColor: '#cc0000'
